      font-size:1.2em;
      color:#fff;
      background-color:var(--accent);
      text-decoration:none;
      border-radius:8px;
      transition:background-color .3s ease;
      cursor:pointer;
      margin-bottom:40px;
      border:none;
    }
    .button:hover { background-color:var(--accent-dark); }
    .note{
      margin-top:1rem;
      color:var(--muted);
      font-size:.95rem;
    }
    @media (max-width:520px){
