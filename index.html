    }

    h2{
      font-size:1.05rem;
      color: var(--muted);
      margin:0 0 1.25rem;
      font-weight:400;
    }

    .button {
      display:inline-block;
      padding:12px 26px;
      font-size:1.05rem;
      color:#fff;
      background: linear-gradient(180deg,var(--accent),var(--accent-dark));
      text-decoration:none;
      border-radius:8px;
      transition: transform .08s ease, box-shadow .12s ease;
      cursor:pointer;
      border:none;
      box-shadow: 0 8px 20px rgba(3,102,214,0.12);
    }

    .button:active{ transform: translateY(1px); }
    .button:hover{ box-shadow: 0 12px 28px rgba(3,102,214,0.14); }

    .note{
      margin-top:1rem;
      color:var(--muted);
      font-size:.95rem;
    }

    /* compact layout for small screens */
    @media (max-width:520px){
      body{ padding:1rem; }
      h1{ font-size:1.25rem; }
      .button{ width:100%; padding:12px; box-sizing:border-box; }
