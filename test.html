<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Milonga as a Service</title>
  <style>
    body{font-family:Arial, sans-serif;background:#f9f9f9;margin:0;padding:2rem 1rem;display:flex;justify-content:center}
    .wrap{max-width:1200px;width:100%;text-align:center}
    .header-image{width:100%;height:auto;display:block;margin:0 auto 1.25rem;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
    h1{margin:.25rem 0;font-size:2rem;color:#333}
    h2{margin:.25rem 0;color:#666;font-size:1.1rem}
    .timestamp{display:inline-block;margin-top:1rem;padding:6px 10px;background:#fff;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,0.06);font-size:.95rem;color:#111}
    @media(max-width:520px){h1{font-size:1.25rem}}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="header-image"
         src="https://raw.githubusercontent.com/andrisstein/andy-dj/refs/heads/main/MaaS%20andy-dj.png"
         alt="Milonga as a Service banner">
    <h1>Milonga as a Service</h1>
    <h2>Welcome to the virtual milonga experience</h2>

    <div class="timestamp" id="build-timestamp">
      <!-- EDIT THIS BEFORE COMMITTING: replace the string value of BUILD_TIMESTAMP below -->
      Updated: 2025-10-26 12:15
    </div>
  </div>

  <script>
    // MANUAL BUILD TIMESTAMP
    // Replace the string below with the current date/time before committing to prove deployment.
    const BUILD_TIMESTAMP = "Updated: 2025-10-26 12:15";
    document.getElementById('build-timestamp').textContent = BUILD_TIMESTAMP;
  </script>
</body>
</html>
